# iPhone app phase alerts (Web Push). Every 5 minutes: sends the alerts that are due to the
# subscribed iPhones. Times and texts come from each phone (the app computes them from the
# phase schedule); this job only delivers them. Secrets: FIREBASE_SA (service account JSON),
# FIREBASE_DB_URL, VAPID_PUBLIC, VAPID_PRIVATE (set by tools/push-setup.js on the developer's PC).
name: iPhone alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/push/package-lock.json
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: .github/push
      - run: node send.js
        working-directory: .github/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
